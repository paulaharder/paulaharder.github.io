<footer class="footer">
  <div class="wrap footer-inner">
    <div>
      <p class="footer-name">{{ site.title }}</p>
      <p class="muted">{{ site.tagline }} · ECMWF</p>
    </div>
    <ul class="social" aria-label="Elsewhere">
      {% for item in site.data.social %}
        <li><a href="{{ item.link }}" aria-label="{{ item.name }}" title="{{ item.name }}">{% include icon.html name=item.icon %}</a></li>
      {% endfor %}
    </ul>
  </div>
  <div class="wrap footer-small muted">
    Built with <a href="https://jekyllrb.com/">Jekyll</a> · Content licensed
    <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>
  </div>
</footer>
