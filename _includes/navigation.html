<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="/">{{ site.title }}</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">
      <span></span><span></span>
    </button>
    <nav id="nav-links" class="nav-links" aria-label="Main">
      {% for item in site.data.navigation %}
        <a href="{{ item.link }}"{% if page.url == item.link %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
      <a href="/#contact">Contact</a>
    </nav>
  </div>
</header>
