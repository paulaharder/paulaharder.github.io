# Project cards on the home page, in display order (AIFS-COMPO has its own section).
# `image` is a figure from the paper, cropped and resized into assets/images/projects/
# (about 900 px wide, JPEG); it is shown whole, letterboxed on white.
- title: Reconstructing carbon monoxide reanalysis
  when: ECMWF · 2026
  image: /assets/images/projects/co-reanalysis.jpg
  alt: Time series of global total-column carbon monoxide for the reanalysis, the control run and the machine-learning reconstruction, 2004 to 2025
  summary: >-
    The end of MOPITT carbon monoxide observations in early 2025 affects the quality of
    the CAMS reanalysis. We test whether a machine-learning model, trained on the
    differences between the reanalysis and a control simulation, can reconstruct
    monthly-mean total-column carbon monoxide without these observations.
  links:
    - label: Paper
      url: https://arxiv.org/abs/2602.15056

- title: Precipitation downscaling across regions
  when: Mila · 2024–2025
  image: /assets/images/projects/precip-downscaling.jpg
  alt: Global maps of downscaling scores for models trained only on a northern and on a tropical training area
  summary: >-
    Generative models for precipitation downscaling are usually trained and tested on a
    single region. RainShift is a benchmark for evaluating how they transfer to other
    regions, and a follow-up study examines their global applicability.
  links:
    - label: RainShift
      url: https://www.nature.com/articles/s41598-025-34557-4
    - label: Global transfer
      url: https://arxiv.org/abs/2512.01400
    - label: Code
      url: https://github.com/RolnickLab/downscaling-transferability
    - label: Dataset
      url: https://huggingface.co/datasets/RainShift/rainshift/blob/main/README.md

- title: Fourier neural operators for downscaling
  when: Mila · 2023
  image: /assets/images/projects/fno-downscaling.jpg
  alt: Downscaled ERA5 water content field next to the high-resolution target
  summary: >-
    A downscaling model based on Fourier neural operators is trained at one upsampling
    factor and can then produce outputs at arbitrary higher resolutions, evaluated on
    fluid-dynamics simulations and ERA5 data. The work was led by Qidong Yang.
  links:
    - label: Paper
      url: https://arxiv.org/abs/2305.14452
    - label: Code
      url: https://github.com/qd-yang/DSFNO

- title: Reservoir computing for sea surface temperature
  when: Allen Institute for AI (Ai2) · 2023
  image: /assets/images/projects/reservoir-sst.jpg
  alt: Global map of the R² score of reservoir-computing sea surface temperature forecasts over a rollout, shown on the six unfolded tiles of a cubed-sphere grid
  summary: >-
    Together with the climate modeling team at Ai2, we tested reservoir computing, a
    recurrent machine-learning method in which only the output layer is trained, for
    predicting sea surface temperature as a component of Earth system digital twins.
  links:
    - label: AGU abstract
      url: https://ui.adsabs.harvard.edu/abs/2023AGUFMIN53C0467H/abstract

- title: Physically constrained downscaling
  when: Mila · 2022–2023
  image: /assets/images/projects/constrained-downscaling.jpg
  alt: Global water content maps at low resolution, from an unconstrained and a constrained network, and at high resolution
  summary: >-
    Neural networks for climate downscaling do not by default conserve quantities such
    as mass. Hard-constraint layers enforce conservation exactly, and in our experiments
    they also improved predictive skill.
  links:
    - label: JMLR paper
      url: https://jmlr.org/papers/v24/23-0158.html
    - label: Code
      url: https://github.com/RolnickLab/constrained-downscaling

- title: Emulating aerosol microphysics
  when: PhD, Fraunhofer ITWM & Oxford · 2019–2022
  image: /assets/images/projects/aerosol-microphysics.jpg
  alt: Global map of the change in sulphuric acid concentration computed by the M7 aerosol microphysics module
  summary: >-
    Aerosol microphysics is a computationally expensive component of climate models. We
    trained physics-informed neural networks to emulate it at a fraction of the cost
    while keeping aerosol mass consistent.
  links:
    - label: Paper
      url: https://www.cambridge.org/core/journals/environmental-data-science/article/physicsinformed-learning-of-aerosol-microphysics/C468660D2AEE8E25DC3BF507517FF91A
    - label: Code
      url: https://github.com/paulaharder/aerosol-microphysics-emulation

- title: Forecasting pyrocumulonimbus clouds
  when: Frontier Development Lab Europe · 2022
  image: /assets/images/projects/pyrocb.jpg
  alt: Geostationary satellite images of a wildfire smoke plume in two wavelength channels
  summary: >-
    Pyrocumulonimbus (pyroCb) clouds are thunderstorms generated by intense wildfires.
    Pyrocast combines a database of pyroCb events, geostationary satellite images and
    meteorological data to forecast them, and a companion study uses causal inference to
    identify their drivers.
  links:
    - label: Pyrocast
      url: https://arxiv.org/abs/2211.13052
    - label: Causes
      url: https://arxiv.org/abs/2211.08883

- title: Night-time satellite imagery
  when: 2020
  image: /assets/images/projects/nightvision.jpg
  alt: Infrared input, the visible image generated by a U-Net, and the true visible image of the same scene
  summary: >-
    Visible satellite images are unavailable at night. NightVision trains image-to-image
    models on daytime scenes to generate visible imagery from infrared observations,
    so it can be produced around the clock.
  links:
    - label: Paper
      url: https://arxiv.org/abs/2011.07017
    - label: Code
      url: https://github.com/paulaharder/hackathon-ci-2020
