# Site settings for paulaharder.github.io (Jekyll, built by GitHub Pages).
# Content that changes often lives in _data/: projects.yml, news.yml,
# publications.yml, navigation.yml and social.yml.
# This file is not reloaded by `jekyll serve`; restart the server after editing it.

title: Paula Harder
tagline: Machine learning for atmospheric composition forecasting
email: paula.harder@ecmwf.int
github_username: paulaharder
twitter:
  username: PaulaHarder8
description: >-
  Paula Harder is a machine learning scientist at ECMWF working on
  data-driven forecasting of atmospheric composition, including the
  AIFS-COMPO system.
author: Paula Harder
url: https://paulaharder.github.io
lang: en

# Reading Files
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# Build settings
markdown: kramdown
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
