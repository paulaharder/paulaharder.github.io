---
layout: main
---
<header class="page-head">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="wrap prose">
  {{ content }}
</div>
