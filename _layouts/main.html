<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1626">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230e7c86'/%3E%3Ccircle cx='11' cy='13' r='3' fill='%23f2b45c'/%3E%3Ccircle cx='20' cy='19' r='4' fill='%23ffffff' fill-opacity='.8'/%3E%3C/svg%3E">
    {% seo %}
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip" href="#content">Skip to content</a>
    {% include navigation.html %}
    <main id="content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script>
      // Mobile menu toggle; the only script on the site.
      document.querySelector('.nav-toggle').addEventListener('click', function () {
        var open = document.body.classList.toggle('nav-open');
        this.setAttribute('aria-expanded', open);
      });
      document.querySelectorAll('.nav-links a').forEach(function (a) {
        a.addEventListener('click', function () { document.body.classList.remove('nav-open'); });
      });
    </script>
  </body>
</html>
